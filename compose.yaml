# Usage:
#   cp app/.env.example .env    # set LLM_API_KEY and any channel tokens
#   docker compose up -d --build
#   open http://localhost:8765  (or the WEBSOCKET_PORT you set in .env)

services:
  anotherbot:
    build: .
    image: anotherbot
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Always win over .env — values meant for running locally would break the container.
      ANOTHERBOT_HOME: /data
      WEBSOCKET_HOST: 0.0.0.0
      # Default login so the web UI starts; set WEB_PASSWORD in .env to change it.
      WEB_PASSWORD: ${WEB_PASSWORD:-botpassword}
    ports:
      # Same port on both sides, so WEBSOCKET_PORT in .env changes the listen and published port together.
      - "${WEBSOCKET_PORT:-8765}:${WEBSOCKET_PORT:-8765}"
    volumes:
      - anotherbot-data:/data

  # Optional throwaway desktop for the computer-use skill (app/skills/computer-use).
  #   docker compose --profile desktop up -d --build desktop
  # The bot reaches it at VNC_HOST=desktop; the passwordless VNC port is only
  # published on the host's loopback, for watching with a VNC viewer.
  desktop:
    build: app/skills/computer-use/desktop
    image: anotherbot-desktop
    profiles: [desktop]
    shm_size: 512m
    ports:
      - "127.0.0.1:5900:5900"

volumes:
  anotherbot-data:
