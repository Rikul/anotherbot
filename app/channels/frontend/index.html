<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>anotherbot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
    <link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
    <!-- ---- Header (full width) ---- -->
    <div id="header">
        <div id="header-left">
            <button id="sidebar-toggle" title="Toggle sidebar">☰</button>
            <h1>anotherbot</h1>
        </div>
        <div id="header-right">
            <div id="status">
                <span id="status-dot"></span>
                <!-- Filled from /api/status; clicking it starts a /model command -->
                <button type="button" id="model-btn" hidden></button>
            </div>
            <div id="render-toggle" role="group" title="How to show bot replies">
                <button type="button" data-mode="md" title="Markdown" aria-label="Markdown" aria-pressed="true">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <rect x="3" y="5" width="18" height="14" rx="2"/>
                        <path d="M7 15V9l3 3 3-3v6"/>
                        <path d="M17 9v4m0 0 2-2m-2 2-2-2"/>
                    </svg>
                </button>
                <button type="button" data-mode="raw" title="Raw" aria-label="Raw" aria-pressed="false">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="8 7 3 12 8 17"/>
                        <polyline points="16 7 21 12 16 17"/>
                    </svg>
                </button>
            </div>
            <button id="theme-btn" title="Toggle light/dark">☾</button>
            <!-- Shown by app.js when /api/status reports that login is enabled -->
            <button type="button" id="logout-btn" title="Log out" aria-label="Log out" hidden>⍈</button>
        </div>
    </div>
    <!-- ---- Body row: sidebar + chat ---- -->
    <div id="body-row">
        <div id="sidebar">
            <div id="sidebar-header">
                <span>Conversations</span>
                <button id="new-conv-btn">+ New</button>
            </div>
            <div id="conv-list"></div>
        </div>
        <div id="main">
            <!-- Scroll container (outer) + messages (inner flex, bottom-anchored) -->
            <div id="messages-wrap">
                <div id="messages">
                    <div id="empty">
                        <div class="icon">✦</div>
                        <p>Ask me anything, or try /help for available commands.</p>
                    </div>
                </div>
            </div>
            <!-- Thinking dots — always just above the input box -->
            <div id="thinking">
                <div class="thinking-bubble">
                    <div class="dots"><span></span><span></span><span></span></div>
                </div>
            </div>
            <!-- Selected-attachment preview chips (populated by JS) -->
            <div id="attachments"></div>
            <div id="input-area">
                <!-- Slash-command autocomplete (populated by app.js) -->
                <div id="cmd-suggest" role="listbox" aria-label="Command suggestions" hidden></div>
                <!--
                    Hidden native file picker. A <label for> (not a JS click) opens
                    it — native label activation works consistently across browsers
                    (Edge included), whereas calling input.click() on a display:none
                    input is unreliable in Edge. Hide it with an inline
                    visually-hidden style (not display:none, and not an external CSS
                    class): display:none suppresses the `change` event in Edge, and
                    an inline style can't be defeated by a stale cached stylesheet.
                -->
                <input type="file" id="file-input" multiple class="visually-hidden"
                       style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">
                <label id="attach-btn" title="Attach files (or paste them into the message box)" for="file-input">
                    <!-- Paperclip icon (inline so it inherits theme colors) -->
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/>
                    </svg>
                </label>
                <textarea id="msg-input" aria-label="Message" aria-autocomplete="list" aria-controls="cmd-suggest" aria-expanded="false" placeholder="Message anotherbot…  (Enter to send, Shift+Enter for newline)" autocomplete="off" rows="1"></textarea>
                <!-- Shown by app.js while the agent is working on a turn -->
                <button type="button" id="stop-btn" title="Stop" aria-label="Stop" hidden>
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                        <rect x="5" y="5" width="14" height="14" rx="2.5"/>
                    </svg>
                </button>
                <button id="send-btn" disabled>Send</button>
            </div>
        </div>
    </div>
</div>
<!-- Vendored (no CDN) so the UI works offline: markdown parser + HTML sanitizer. -->
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
